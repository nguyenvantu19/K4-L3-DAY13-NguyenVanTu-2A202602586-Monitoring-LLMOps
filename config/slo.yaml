service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "This lab target is 99.5% of requests returning successfully within 3 seconds over a rolling 28-day window. The 3-second limit is a user-visible response budget and includes retrieval plus generation; use the measured latency baseline to revise it if normal traffic cannot meet it. The 0.5% error budget allows at most 50 bad requests per 10,000 eligible requests."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
