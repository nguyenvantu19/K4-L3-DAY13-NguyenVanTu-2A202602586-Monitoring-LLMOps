alerts:
  - name: UserWaitsTooLong
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602586
    runbook: docs/alerts.md#alert-1
  - name: RequestsFailing
    severity: critical
    condition: request_failed / request_received * 100 > 2%
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602586
    runbook: docs/alerts.md#alert-2
  - name: RetrievalOftenMisses
    severity: warning
    condition: retrieval_success_rate < 90%
    duration: 10m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602586
    runbook: docs/alerts.md#alert-3
